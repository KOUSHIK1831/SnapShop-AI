services:
  postgres:
    image: postgres:16-alpine
    container_name: snapshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapshop
      POSTGRES_PASSWORD: snapshop_dev_password
      POSTGRES_DB: snapshop
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snapshop']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: snapshop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: snapshop-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
  minio_data:
