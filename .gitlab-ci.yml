# ApnaBazar GitLab CI/CD Pipeline
# Optimized for performance and comprehensive validation

stages:
  - validate
  - test
  - build

# Global cache for npm dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

# Use a specific, stable Node version
image: node:22-alpine

before_script:
  - apk add --no-cache git
  - npm ci --cache .npm --prefer-offline

# Fast check for linting and type safety
lint-and-typecheck:
  stage: validate
  script:
    - echo "Running ESLint..."
    - npm run lint
    - echo "Running TypeScript type checks..."
    - npm run type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Execute unit tests and collect coverage
unit-tests:
  stage: test
  script:
    - echo "Running tests with coverage..."
    - npm run test:coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build the production application
build-app:
  stage: build
  script:
    - echo "Building ApnaBazar production bundle..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
