# SnapShop AI GitLab CI/CD Pipeline
# GitHub Actions (.github/workflows/ci.yml) is the authoritative pipeline.
# This mirror keeps the legacy GitLab project green with the pnpm monorepo.

stages:
  - validate
  - test
  - build

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store/

image: node:26-alpine

variables:
  NODE_OPTIONS: '--max-old-space-size=3072'
  PNPM_HOME: /pnpm

before_script:
  - corepack enable
  - corepack prepare pnpm@11.28.5 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

lint:
  stage: validate
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

format:
  stage: validate
  script:
    - pnpm format:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

type-check:
  stage: validate
  script:
    - pnpm typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  script:
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coverage:
  stage: test
  script:
    - pnpm --filter @snapshop/web test:coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/web/coverage/cobertura-coverage.xml
    paths:
      - apps/web/coverage/
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - apps/web/dist/
      - apps/api/dist/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

gitleaks:
  stage: validate
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: ['']
  before_script: []
  script:
    - gitleaks detect --source . --no-git --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dependency-audit:
  stage: validate
  script:
    - pnpm audit --audit-level high || true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
