# SnapShop AI GitLab CI/CD Pipeline
# Optimized for performance and comprehensive validation

stages:
  - lint
  - format
  - type-check
  - test
  - coverage
  - build
  - security
  - validate

# Global cache for npm dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

# Use a specific, stable Node version
image: node:22-alpine

before_script:
  - apk add --no-cache git
  - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - echo "Running ESLint..."
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

format:
  stage: format
  script:
    - echo "Running Prettier format check..."
    - npm run format:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

type-check:
  stage: type-check
  script:
    - echo "Running TypeScript type checks..."
    - npm run type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  script:
    - echo "Running unit tests..."
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coverage:
  stage: coverage
  script:
    - echo "Running tests with coverage..."
    - npm run test:coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - echo "Building SnapShop AI production bundle..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: ['']
  before_script: []
  script:
    - gitleaks detect --source . --no-git --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dependency-audit:
  stage: validate
  script:
    - echo "Running npm audit..."
    - npm audit --audit-level=high || true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
